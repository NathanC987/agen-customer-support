# Vector database for the knowledge-base RAG (semantic search over articles + product catalog).
#   docker compose up -d       → Qdrant on http://localhost:6333 (dashboard: /dashboard)
#   npm run rag:index          → (re)embed the knowledge base + catalog into it
services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: nimbus-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
volumes:
  qdrant_data:
